[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/regions/*.bin,data/crops/*/*.json,data/crops/*/raw/*.bin,assets/painted/source-manifest.json,assets/illustrated/source-manifest.json"
exclude_filter="assets/reference/*,苔屿桌面微观农场 PRD V2.0.md,tools/*,build/*,docs/*,tests/*,native/*,dev/*,3D 桌面微观农场.md,最终产品需求文档.md,README.md"
export_path="build/MossImmersive.exe"
encryption_include_filters=""
encryption_exclude_filters=""
